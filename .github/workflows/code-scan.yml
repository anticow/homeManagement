name: Dependency Audit

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  schedule:
    # Full scan every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'

permissions:
  contents: read

# Note: CodeQL SAST is handled by GitHub's default setup (repository Security settings).
# Adding a custom CodeQL job here conflicts with default setup and fails with:
#   "CodeQL analyses from advanced configurations cannot be processed when the default setup is enabled"
# The NuGet vulnerability audit below fills the gap for dependency CVE scanning.

jobs:
  dependency-audit:
    name: NuGet Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore homeManagement.sln

      - name: Audit vulnerable packages
        run: |
          dotnet list homeManagement.sln package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          # Fail if any vulnerable packages are found
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable NuGet packages detected — see vuln-report.txt"
            cat vuln-report.txt
            exit 1
          fi
          echo "No vulnerable packages found."
