title = "HomeManagement Gitleaks Config"

[extend]
# Use the default gitleaks ruleset as the base
useDefault = true

[allowlist]
  paths = [
    '''.env\.example''',
    '''.*\.example''',
    '''.*\.sample''',
    '''deploy/docker/README\.md''',
  ]
  regexes = [
    '''ValidationPassword_123!''',
    '''validation-signing-key.*''',
    '''validation-agent-gateway-api-key''',
  ]
