repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.0.1
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-added-large-files
- repo: https://github.com/adrienvernier/yamllint
  rev: v1.29.0
  hooks:
  - id: yamllint
- repo: https://github.com/dotnet/format
  rev: v5.1.225507
  hooks:
  - id: dotnet-format
