{{- if and .Values.ingress.enabled .Values.healthPage.enabled -}}
{{- /*
  Health supports HTTPS using the shared ingress certificate.
  Keep plain HTTP available without redirects for existing uptime monitors.
  Only the /platform-health path is exposed; the rest of the gateway remains HTTPS-only.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hm-health-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homemanagement.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    {{- include "homemanagement.controlIngressTls" . | nindent 4 }}
    # Redirect bare / to the health page so http://health.cowgomu.net/ works
    nginx.ingress.kubernetes.io/app-root: /platform-health
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.healthPage.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.healthPage.host | quote }}
      http:
        paths:
          - path: {{ ternary "/platform-health" "/" .Values.managedServices.enabled }}
            pathType: Prefix
            backend:
              service:
                name: hm-gateway
                port:
                  number: {{ .Values.gateway.port }}
{{- end }}
