{{- $svcName := "hm-agent-gw" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homemanagement.labels" . | nindent 4 }}
    app: {{ $svcName }}
spec:
  {{- if .Values.managedServices.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  replicas: {{ .Values.agentGateway.replicaCount }}
  selector:
    matchLabels:
      app: {{ $svcName }}
  template:
    metadata:
      labels:
        app: {{ $svcName }}
    spec:
      {{- if .Values.global.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: ghcr-pull-secret
      {{- end }}
      containers:
        - name: agent-gateway
          image: {{ include "homemanagement.image" (dict "global" .Values.global "image" .Values.agentGateway.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.agentGateway.port }}
              name: grpc
            - containerPort: {{ .Values.agentGateway.apiPort }}
              name: api
          env:
            - name: APP_VERSION
              value: {{ .Values.agentGateway.image.tag | default .Values.global.imageTag | quote }}
            - name: Kestrel__Endpoints__Grpc__Url
              value: "{{ include "homemanagement.controlScheme" . }}://+:{{ .Values.agentGateway.port }}"
            {{- include "homemanagement.controlTlsEnv" . | nindent 12 }}
            - name: Kestrel__Endpoints__Grpc__Protocols
              value: "Http2"
            - name: Kestrel__Endpoints__Health__Url
              value: "{{ include "homemanagement.controlScheme" . }}://+:{{ .Values.agentGateway.apiPort }}"
            - name: Kestrel__Endpoints__Health__Protocols
              value: "Http1"
            - name: AgentGateway__ApiKey
              valueFrom:
                secretKeyRef:
                  name: hm-secrets
                  key: agent-gateway-api-key
            - name: AgentGateway__AgentApiKeysJson
              valueFrom:
                secretKeyRef:
                  name: hm-secrets
                  key: agent-gateway-agent-api-keys.json
            - name: Seq__Url
              value: {{ .Values.seq.url | quote }}
            - name: Serilog__MinimumLevel__Default
              value: {{ .Values.serilog.minimumLevel | quote }}
            - name: Serilog__MinimumLevel__Override__Microsoft.AspNetCore
              value: {{ .Values.serilog.overrides.microsoftAspNetCore | quote }}
            - name: Serilog__MinimumLevel__Override__Grpc
              value: {{ .Values.serilog.overrides.grpc | quote }}
            - name: Serilog__MinimumLevel__Override__System.Net.Http
              value: {{ .Values.serilog.overrides.systemNetHttp | quote }}
            - name: AllowedHosts
              value: "{{ .Values.ingress.agentGatewayHost }};hm-agent-gw;hm-agent-gw.{{ .Release.Namespace }}.svc.cluster.local;localhost"
          {{- if .Values.managedServices.enabled }}
            - name: AgentGateway__RevocationListPath
              value: "/revocations/revoked-agents.json"
          volumeMounts:
            {{- include "homemanagement.controlTlsMounts" . | nindent 12 }}
            - name: revocations
              mountPath: /revocations
          {{- end }}
          resources:
            {{- toYaml .Values.agentGateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.agentGateway.apiPort }}
              scheme: {{ ternary "HTTPS" "HTTP" .Values.managedServices.enabled }}
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.agentGateway.apiPort }}
              scheme: {{ ternary "HTTPS" "HTTP" .Values.managedServices.enabled }}
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.managedServices.enabled }}
      volumes:
        {{- include "homemanagement.controlTlsVolumes" . | nindent 8 }}
        - name: revocations
          persistentVolumeClaim:
            claimName: {{ .Values.managedServices.revocationExistingClaim }}
      {{- end }}
