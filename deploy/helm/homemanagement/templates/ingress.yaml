{{- end }}
{{- if .Values.ingress.authHost }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hm-auth-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homemanagement.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: {{ .Values.ingress.sslRedirect | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- include "homemanagement.controlIngressTls" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.authHost | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.authHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hm-auth
                port:
                  number: {{ .Values.authService.port }}
{{- end }}
{{- if .Values.ingress.agentGatewayHost }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hm-agent-gw-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homemanagement.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: {{ .Values.ingress.sslRedirect | quote }}
    {{- if .Values.managedServices.enabled }}
    {{- with omit .Values.ingress.grpcAnnotations "nginx.ingress.kubernetes.io/backend-protocol" "nginx.ingress.kubernetes.io/proxy-ssl-verify" "nginx.ingress.kubernetes.io/proxy-ssl-server-name" "nginx.ingress.kubernetes.io/proxy-ssl-name" "nginx.ingress.kubernetes.io/proxy-ssl-secret" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    nginx.ingress.kubernetes.io/backend-protocol: "GRPCS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: "hm-control"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "{{ .Values.namespace }}/{{ .Values.managedServices.tlsSecretName }}"
    {{- else }}
    {{- with .Values.ingress.grpcAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.agentGatewayHost | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.agentGatewayHost | quote }}
      http:
        paths:
          # Restrict the public listener to the generated gRPC service path.
          # The REST control plane is served by the same process but must only
          # be reached through the internal API service port.
          - path: /homemanagement.agent.v1.AgentHub
            pathType: Prefix
            backend:
              service:
                name: hm-agent-gw
                port:
                  number: {{ .Values.agentGateway.port }}
{{- end }}
{{- end }}
