# docker-compose.swarm-secrets.yaml
#
# Docker Swarm Secrets overlay — production-grade secret injection pattern.
#
# USAGE:
#   Deploy this stack with Swarm to avoid storing secrets in .env files:
#
#     # Create secrets once (run as a privileged operator):
#     printf '%s' "$HM_SQL_SA_PASSWORD"          | docker secret create hm_sql_sa_password -
#     printf '%s' "$HM_JWT_SIGNING_KEY"           | docker secret create hm_jwt_signing_key -
#     printf '%s' "$HM_AUDIT_HMAC_KEY"            | docker secret create hm_audit_hmac_key -
#     printf '%s' "$HM_AGENT_GATEWAY_API_KEY"     | docker secret create hm_agent_gateway_api_key -
#     printf '%s' "$HM_BOOTSTRAP_ADMIN_PASSWORD"  | docker secret create hm_bootstrap_admin_password -
#
#     # Deploy the stack:
#     docker stack deploy -c docker-compose.yaml -c docker-compose.swarm-secrets.yaml homemanagement
#
# HOW IT WORKS:
#   Docker Swarm mounts each secret as a file under /run/secrets/<name>.
#   ASP.NET Core's FileConfigurationProvider reads /run/secrets files
#   when the Docker secrets provider is wired in (see AddDockerSecrets extension).
#   The overlay here removes the env-var references and replaces them with
#   Docker secret mounts.  The application code reads the same config keys
#   via IConfiguration — no code changes are required.
#
# WHY NOT FOR DEV:
#   Docker secrets require Swarm mode (`docker swarm init`).  Plain
#   `docker compose up` does not support the `secrets:` top-level key.
#   Use the .env file for local development only.  It is git-ignored.
#
# REFERENCES:
#   https://docs.docker.com/engine/swarm/secrets/
#   https://docs.microsoft.com/en-us/aspnet/core/security/app-secrets

secrets:
  hm_sql_sa_password:
    external: true
  hm_jwt_signing_key:
    external: true
  hm_audit_hmac_key:
    external: true
  hm_agent_gateway_api_key:
    external: true
  hm_bootstrap_admin_password:
    external: true

services:
  sqlserver:
    environment:
      MSSQL_SA_PASSWORD: ""      # cleared — set via secret file instead
    secrets:
      - hm_sql_sa_password
    # MSSQL reads MSSQL_SA_PASSWORD_FILE when present (since 2022-CU1).
    # Set the env var to point to the mounted secret:
    environment:
      MSSQL_SA_PASSWORD_FILE: /run/secrets/hm_sql_sa_password

  broker:
    environment:
      # Connection string reads password from secret file via custom factory.
      ConnectionStrings__HomeManagement: ""
    secrets:
      - hm_sql_sa_password
      - hm_jwt_signing_key
      - hm_audit_hmac_key
      - hm_agent_gateway_api_key

  auth:
    secrets:
      - hm_sql_sa_password
      - hm_jwt_signing_key
      - hm_bootstrap_admin_password

  gateway:
    secrets:
      - hm_jwt_signing_key

  agent-gw:
    secrets:
      - hm_agent_gateway_api_key
